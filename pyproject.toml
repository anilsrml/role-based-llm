[project]
name = "rolchat"
version = "0.1.0"
description = "Role-based LLM chat: each character only reaches the data its role allows."
readme = "README.md"
authors = [
    { name = "Anıl Sürmeli", email = "126188687+anilsrml@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "casbin>=1.43.0",
    "chainlit>=2.12.0",
    "faker>=40.44.0",
    "greenlet>=3.5.6",
    "langchain-openai>=1.7.3",
    "langfuse>=5.1.0",
    "nemoguardrails>=0.24.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[openrouter]>=2.64.0",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real models through OpenRouter (needs OPENROUTER_API_KEY)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
